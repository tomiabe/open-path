name: Check official visa source links

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-official-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Check Home Affairs source links
        uses: lycheeverse/lychee-action@7da8ec1fc4e01b5a12062ac6c589c10a4ce70d67 # v2.0.0
        with:
          args: --no-progress --max-retries 3 --retry-wait-time 2 --include 'https://immi\.homeaffairs\.gov\.au/.*' dist/source-notes.html
