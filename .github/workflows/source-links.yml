name: Check official guide source links

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-official-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Check registered government and transport sources
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --no-progress --max-retries 3 --retry-wait-time 2 --accept 403 --accept-timeouts --include 'https://([^/]+\.)?(homeaffairs\.gov\.au|abf\.gov\.au|servicesaustralia\.gov\.au|ato\.gov\.au|fairwork\.gov\.au|scamwatch\.gov\.au|jobsandskills\.gov\.au|business\.gov\.au|nsw\.gov\.au|consumer\.vic\.gov\.au|rta\.qld\.gov\.au|consumerprotection\.wa\.gov\.au|sa\.gov\.au|consumeraffairs\.tas\.gov\.au|act\.gov\.au|consumeraffairs\.nt\.gov\.au|transportnsw\.info|transport\.vic\.gov\.au|translink\.com\.au|transperth\.wa\.gov\.au|nt\.gov\.au|metrotas\.com\.au|adelaidemetro\.com\.au)/.*' dist/source-notes.html
